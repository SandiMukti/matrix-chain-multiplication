<style>
.viewer{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.viewer>*{min-width:0}
.stage-box{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#0B1220;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.slide{position:absolute;inset:0;width:1920px;height:1080px;box-sizing:border-box;opacity:0;transition:opacity .35s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide h1,.slide h2,.slide h3,.slide p{margin:0;text-wrap:balance}
.slide ol,.slide ul{margin:0;padding-left:1.3em;display:grid;gap:14px}
.slide table{border-collapse:collapse;width:100%}
.slide th,.slide td{padding:.35em .6em;border-bottom:1px solid #D8DCD6;text-align:left}
.slide img{max-width:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .count{font-family:var(--font-mono);color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.bar select{width:auto;min-width:0;max-width:100%;flex:1 1 200px}
.progress{height:4px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:grid;gap:6px}
.notes p{max-width:80ch}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumbs button{all:unset;cursor:pointer;display:grid;gap:6px;font-size:.8rem;color:var(--muted)}
.thumbs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.thumbs .t{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;border:2px solid transparent;background:#0B1220}
.thumbs button[aria-current="true"] .t{border-color:var(--accent)}
.thumbs .t .stage{pointer-events:none}
.stage-box:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh;background:#000}
</style>
</head>

    <h2 style="font-size:1.4rem;margin-top:18px">Semua slide</h2>
    <div class="thumbs" id="thumbs"></div>
  </section>
</main>
<script>
(() => {
  const { $ } = MCM;
  const SLIDES = [{"id": "cover", "style": "background:#14213D;color:#F5F6F2;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:space-between", "html": "<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;color:#8FB3E8;letter-spacing:2px\">ANALISIS ALGORITMA KOMPUTASI · ALGORITMA NO. 15</p>\n<div style=\"display:flex;flex-direction:column;gap:40px\">\n<h1 style=\"font-size:104px;font-weight:700;line-height:1.05;color:#F5F6F2\">Matrix Chain Multiplication</h1>\n<p style=\"font-size:40px;line-height:1.35;color:#BFCBDD;width:1300px\">Pemrograman dinamis untuk mencari urutan perkalian matriks dengan biaya paling kecil: bukti, kompleksitas, dan studi kasus nyata</p>\n</div>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<p style=\"font-size:32px;font-weight:600;color:#F5F6F2\">Sandi Mukti Lahambu · D082261025</p>\n<p style=\"font-size:26px;color:#BFCBDD\">Magister Teknik Informatika, Fakultas Teknik, Universitas Hasanuddin</p>\n</div>", "notes": "Perkenalkan diri. Topik saya algoritma nomor 15, Matrix Chain Multiplication. Dalam 15 menit saya akan membahas masalahnya, algoritma pemrograman dinamis beserta bukti dan kompleksitasnya, lalu hasil eksperimen dan studi kasus.", "title": "Matrix Chain Multiplication"}, {"id": "masalah", "style": "background:#F5F6F2;color:#3E4A5C;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:56px", "html": "<h2 style=\"font-size:64px;font-weight:600;line-height:1.15;color:#14213D\">Hasil sama, biaya bisa 10 kali berbeda</h2>\n<p style=\"font-size:32px;line-height:1.4;width:1500px\">Matriks A (10 × 100), B (100 × 5), C (5 × 50). Perkalian bersifat asosiatif, jadi urutan bebas dipilih. Mengalikan p × q dengan q × r butuh p·q·r perkalian skalar.</p>\n<div style=\"display:flex;gap:40px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:16px;background:#FBFBF8;padding:48px;border:2px solid #1F5FBF;border-radius:16px\">\n<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:600;color:#14213D\">(AB)C</p>\n<p style=\"font-size:120px;font-weight:700;line-height:1;color:#1F5FBF\">7.500</p>\n<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:26px\">10·100·5 + 10·5·50</p>\n</div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:16px;background:#FBFBF8;padding:48px;border:2px solid #D8DCD6;border-radius:16px\">\n<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:600;color:#14213D\">A(BC)</p>\n<p style=\"font-size:120px;font-weight:700;line-height:1;color:#C4610E\">75.000</p>\n<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:26px\">100·5·50 + 10·100·50</p>\n</div>\n</div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7585\">Contoh dari Cormen dkk. [1] · 02</p>", "notes": "Mulai dari contoh sederhana. Tiga matriks, dua cara mengurung. Hasil akhirnya sama persis, tapi urutan pertama butuh 7.500 perkalian skalar, urutan kedua 75.000, sepuluh kali lebih banyak. Masalah MCM adalah mencari urutan dengan biaya paling kecil. Algoritmanya tidak mengalikan matriks, hanya menentukan urutan.", "title": "Hasil sama, biaya bisa 10 kali berbeda"}, {"id": "ledakan", "style": "background:#14213D;color:#BFCBDD;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;justify-content:center;gap:40px", "html": "<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;color:#8FB3E8;letter-spacing:2px\">MENCOBA SEMUA KEMUNGKINAN</p>\n<h2 style=\"font-size:180px;font-weight:700;line-height:1;color:#F5F6F2\">2.674.440</h2>\n<p style=\"font-size:44px;line-height:1.3;color:#F5F6F2;width:1500px\">cara mengurung rantai yang hanya berisi 15 matriks</p>\n<p style=\"font-size:32px;line-height:1.4;width:1450px\">Banyaknya pengurungan mengikuti bilangan Catalan C(n−1), yang tumbuh Ω(4ⁿ / n^3/2). Brute force tidak praktis, sehingga dibutuhkan algoritma yang lebih cerdas.</p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#8F9BB0\">03</p>", "notes": "Kenapa tidak dicoba semua saja? Karena banyaknya pengurungan adalah bilangan Catalan, yang tumbuh eksponensial. Untuk 15 matriks saja sudah ada lebih dari 2,6 juta kemungkinan. Di sinilah pemrograman dinamis masuk.", "title": "2.674.440"}, {"id": "rekurens", "style": "background:#F5F6F2;color:#3E4A5C;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px", "html": "<h2 style=\"font-size:64px;font-weight:600;line-height:1.15;color:#14213D\">Rekurens pemrograman dinamis</h2>\n<div style=\"background:#FBFBF8;border:1px solid #D8DCD6;border-radius:16px;padding:48px;display:flex;flex-direction:column;gap:20px\">\n<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:36px;color:#14213D\">m[i, i] = 0</p>\n<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:36px;color:#14213D\">m[i, j] = min<span style=\"color:#1F5FBF\"> i ≤ k &lt; j </span>{ m[i, k] + m[k+1, j] + p<span style=\"color:#C4610E\">ᵢ₋₁·pₖ·pⱼ</span> }</p>\n</div>\n<div style=\"display:flex;gap:32px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n<h3 style=\"font-size:32px;font-weight:600;color:#14213D\">Subproblem</h3>\n<p style=\"font-size:28px;line-height:1.4\">m[i, j] = biaya minimum mengalikan Aᵢ…Aⱼ. Hanya ada Θ(n²) subproblem.</p>\n</div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n<h3 style=\"font-size:32px;font-weight:600;color:#14213D\">Pilihan k</h3>\n<p style=\"font-size:28px;line-height:1.4\">Coba semua titik belah: (Aᵢ…Aₖ)(Aₖ₊₁…Aⱼ). Simpan k terbaik di tabel s[i, j].</p>\n</div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n<h3 style=\"font-size:32px;font-weight:600;color:#14213D\">Biaya gabung</h3>\n<p style=\"font-size:28px;line-height:1.4\">Hasil kiri pᵢ₋₁ × pₖ dan kanan pₖ × pⱼ, jadi digabung dengan pᵢ₋₁·pₖ·pⱼ.</p>\n</div>\n</div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7585\">04</p>", "notes": "Intinya satu rekurens. m[i,j] adalah biaya minimum subrantai A_i sampai A_j. Untuk setiap titik belah k, biayanya kiri ditambah kanan ditambah biaya mengalikan dua hasilnya. Kita ambil minimum, dan k terbaik disimpan di tabel s untuk merekonstruksi pengurungan.", "title": "Rekurens pemrograman dinamis"}, {"id": "pseudocode", "style": "background:#F5F6F2;color:#3E4A5C;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px", "html": "<h2 style=\"font-size:64px;font-weight:600;line-height:1.15;color:#14213D\">Mengisi tabel dari subrantai terpendek</h2>\n<div style=\"display:flex;gap:48px;align-items:start\">\n<div style=\"flex:3;background:#14213D;border-radius:16px;padding:40px\">\n<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:26px;line-height:1.5;color:#E3E8F0\">MATRIX-CHAIN-ORDER(p)<br>n ← panjang(p) − 1<br>for i ← 1 to n: m[i,i] ← 0<br><span style=\"color:#8FB3E8\">for l ← 2 to n</span>            ▷ panjang<br>   for i ← 1 to n − l + 1<br>      j ← i + l − 1;  m[i,j] ← ∞<br>      <span style=\"color:#F0A35C\">for k ← i to j − 1</span>   ▷ titik belah<br>         q ← m[i,k] + m[k+1,j] + p[i−1]·p[k]·p[j]<br>         if q &lt; m[i,j]:<br>            m[i,j] ← q;  s[i,j] ← k<br>return m, s</p>\n</div>\n<div style=\"flex:2;display:flex;flex-direction:column;gap:28px\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<h3 style=\"font-size:32px;font-weight:600;color:#14213D\">Kenapa per panjang l?</h3>\n<p style=\"font-size:28px;line-height:1.4\">m[i,k] dan m[k+1,j] lebih pendek dari l, jadi selalu sudah terisi saat dipakai.</p>\n</div>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<h3 style=\"font-size:32px;font-weight:600;color:#14213D\">Rekonstruksi</h3>\n<p style=\"font-size:28px;line-height:1.4\">PRINT-PARENS membaca s[i,j] secara rekursif, Θ(n).</p>\n</div>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<h3 style=\"font-size:32px;font-weight:600;color:#14213D\">Implementasi</h3>\n<p style=\"font-size:28px;line-height:1.4\">Python murni, tabel (n+1)×(n+1) agar indeks sama dengan pseudocode.</p>\n</div>\n</div>\n</div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7585\">Diadaptasi dari Cormen dkk. [1] · 05</p>", "notes": "Tiga loop bersarang. Loop terluar berdasarkan panjang subrantai l, bukan i lalu j. Alasannya, saat menghitung m[i,j] kita butuh m[i,k] dan m[k+1,j] yang lebih pendek, dan urutan ini menjamin keduanya sudah terisi. Ini pertanyaan yang sering muncul.", "title": "Mengisi tabel dari subrantai terpendek"}, {"id": "contoh", "style": "background:#F5F6F2;color:#3E4A5C;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px", "html": "<h2 style=\"font-size:64px;font-weight:600;line-height:1.15;color:#14213D\">Contoh manual: enam matriks CLRS</h2>\n<div style=\"display:flex;gap:56px;align-items:start\">\n<div style=\"flex:3;display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:26px;color:#14213D\">p = ⟨30, 35, 15, 5, 10, 20, 25⟩ · tabel m[i, j]</p>\n<table style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:26px;color:#3E4A5C;background:#FBFBF8\">\n<tr><th style=\"width:10%\">i\\j</th><th style=\"width:15%;text-align:right\">1</th><th style=\"width:15%;text-align:right\">2</th><th style=\"width:15%;text-align:right\">3</th><th style=\"width:15%;text-align:right\">4</th><th style=\"width:15%;text-align:right\">5</th><th style=\"width:15%;text-align:right\">6</th></tr>\n<tr><td>1</td><td style=\"text-align:right\">0</td><td style=\"text-align:right\">15.750</td><td style=\"text-align:right\">7.875</td><td style=\"text-align:right\">9.375</td><td style=\"text-align:right\">11.875</td><td style=\"text-align:right;color:#1F5FBF\">15.125</td></tr>\n<tr><td>2</td><td></td><td style=\"text-align:right\">0</td><td style=\"text-align:right\">2.625</td><td style=\"text-align:right\">4.375</td><td style=\"text-align:right\">7.125</td><td style=\"text-align:right\">10.500</td></tr>\n<tr><td>3</td><td></td><td></td><td style=\"text-align:right\">0</td><td style=\"text-align:right\">750</td><td style=\"text-align:right\">2.500</td><td style=\"text-align:right\">5.375</td></tr>\n<tr><td>4</td><td></td><td></td><td></td><td style=\"text-align:right\">0</td><td style=\"text-align:right\">1.000</td><td style=\"text-align:right\">3.500</td></tr>\n<tr><td>5</td><td></td><td></td><td></td><td></td><td style=\"text-align:right\">0</td><td style=\"text-align:right\">5.000</td></tr>\n<tr><td>6</td><td></td><td></td><td></td><td></td><td></td><td style=\"text-align:right\">0</td></tr>\n</table>\n</div>\n<div style=\"flex:2;display:flex;flex-direction:column;gap:32px\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<p style=\"font-size:24px;color:#6B7585;letter-spacing:1px\">BIAYA MINIMUM m[1, 6]</p>\n<p style=\"font-size:96px;font-weight:700;line-height:1;color:#1F5FBF\">15.125</p>\n</div>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<p style=\"font-size:24px;color:#6B7585;letter-spacing:1px\">PENGURUNGAN OPTIMAL</p>\n<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;font-weight:600;color:#14213D\">((A₁(A₂A₃))((A₄A₅)A₆))</p>\n</div>\n<p style=\"font-size:28px;line-height:1.4\">s[1,6] = 3 membelah rantai di A₃, lalu s[1,3] = 1 dan s[4,6] = 5.</p>\n</div>\n</div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7585\">Hasil DP sama dengan brute force dan perhitungan manual · 06</p>", "notes": "Ini contoh klasik dari CLRS. Tabel diisi diagonal demi diagonal. Contoh satu sel: m[2,5] punya tiga pilihan k, hasilnya 13.000, 7.125, dan 11.375, jadi diambil 7.125 dengan k = 3. Hasil akhirnya 15.125, dan pengurungannya dibaca dari tabel s.", "title": "Contoh manual: enam matriks CLRS"}, {"id": "bukti", "style": "background:#F5F6F2;color:#3E4A5C;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px", "html": "<h2 style=\"font-size:64px;font-weight:600;line-height:1.15;color:#14213D\">Bukti kebenaran</h2>\n<div style=\"display:flex;gap:40px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:20px;background:#FBFBF8;padding:48px;border:1px solid #D8DCD6;border-radius:16px\">\n<p style=\"font-size:24px;color:#1F5FBF;letter-spacing:1px;font-weight:600\">LEMMA · OPTIMAL SUBSTRUCTURE</p>\n<p style=\"font-size:30px;line-height:1.45\">Jika solusi optimal Aᵢ…Aⱼ membelah di k, bagian Aᵢ…Aₖ di dalamnya juga optimal.</p>\n<p style=\"font-size:28px;line-height:1.45\"><b>Cut-and-paste:</b> andaikan ada pengurungan Aᵢ…Aₖ yang lebih murah. Menggantinya menurunkan total biaya, padahal pᵢ₋₁pₖpⱼ tetap. Kontradiksi.</p>\n</div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:20px;background:#FBFBF8;padding:48px;border:1px solid #D8DCD6;border-radius:16px\">\n<p style=\"font-size:24px;color:#1F5FBF;letter-spacing:1px;font-weight:600\">TEOREMA · INDUKSI PADA PANJANG l</p>\n<p style=\"font-size:28px;line-height:1.45\"><b>Basis l = 1:</b> m[i,i] = 0, benar.</p>\n<p style=\"font-size:28px;line-height:1.45\"><b>Langkah:</b> perkalian terakhir membelah di suatu k. Kedua bagian lebih pendek, jadi sudah benar. Dengan lemma, minimum atas semua k adalah biaya optimal.</p>\n</div>\n</div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7585\">07</p>", "notes": "Kebenarannya dua lapis. Pertama lemma optimal substructure dengan argumen cut-and-paste. Kedua induksi pada panjang subrantai. Algoritma juga pasti berhenti karena semua loop berbatas.", "title": "Bukti kebenaran"}, {"id": "kompleksitas", "style": "background:#F5F6F2;color:#3E4A5C;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:44px", "html": "<h2 style=\"font-size:64px;font-weight:600;line-height:1.15;color:#14213D\">Kompleksitas: tepat (n³ − n)/6 evaluasi</h2>\n<div style=\"background:#FBFBF8;border:1px solid #D8DCD6;border-radius:16px;padding:40px;display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:30px;color:#14213D\">T(n) = Σ<span style=\"color:#6B7585\"> l=2..n </span>(n − l + 1)(l − 1) = Σ<span style=\"color:#6B7585\"> t=1..n−1 </span>(n − t)·t</p>\n<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:30px;color:#14213D\">     = n·(n−1)n/2 − (n−1)n(2n−1)/6 = <span style=\"color:#1F5FBF\">(n³ − n)/6</span></p>\n</div>\n<div style=\"display:flex;gap:32px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px\">\n<p style=\"font-size:72px;font-weight:700;line-height:1;color:#1F5FBF\">Θ(n³)</p>\n<p style=\"font-size:28px;line-height:1.4\">waktu, sebab n³/12 ≤ T(n) ≤ n³/6 untuk n ≥ 2</p>\n</div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px\">\n<p style=\"font-size:72px;font-weight:700;line-height:1;color:#1F5FBF\">Θ(n²)</p>\n<p style=\"font-size:28px;line-height:1.4\">ruang, untuk tabel m dan s</p>\n</div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px\">\n<p style=\"font-size:72px;font-weight:700;line-height:1;color:#14213D\">sama</p>\n<p style=\"font-size:28px;line-height:1.4\">kasus terbaik, rata-rata, dan terburuk; jumlah iterasi hanya bergantung pada n</p>\n</div>\n</div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7585\">Pemeriksaan: n = 6 → (216 − 6)/6 = 35 evaluasi · 08</p>", "notes": "Ini bagian berbobot terbesar. Untuk panjang l ada n − l + 1 nilai i, masing-masing l − 1 pilihan k. Dengan substitusi t = l − 1 dan rumus jumlah deret, hasilnya tepat (n³ − n)/6, jadi Θ(n³). Karena banyaknya iterasi tidak bergantung pada nilai p, kasus terbaik sampai terburuk sama. Brute force sebagai pembanding: R(n) = 3^(n−1) pemanggilan.", "title": "Kompleksitas: tepat (n³ − n)/6 evaluasi"}, {"id": "eksp1", "style": "background:#FBFBF8;color:#3E4A5C;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:32px", "html": "<h2 style=\"font-size:64px;font-weight:600;line-height:1.15;color:#14213D\">Pengukuran mengikuti kurva n³</h2>\n<div style=\"display:flex;gap:56px;align-items:center\">\n<img src=\"assets/img/gambar1.png\" alt=\"Grafik log-log waktu DP terhadap n dari 50 sampai 800 dengan kurva teoretis c·n³; kemiringan 3,127\" style=\"width:920px;height:648px;object-fit:contain\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:32px\">\n<div style=\"display:flex;flex-direction:column;gap:4px\">\n<p style=\"font-size:24px;color:#6B7585;letter-spacing:1px\">KEMIRINGAN LOG-LOG</p>\n<p style=\"font-size:120px;font-weight:700;line-height:1;color:#1F5FBF\">3,127</p>\n<p style=\"font-size:28px\">teori: 3</p>\n</div>\n<p style=\"font-size:28px;line-height:1.45\">n = 50 → 800: waktu naik dari 0,006 s menjadi 33,9 s.</p>\n<p style=\"font-size:28px;line-height:1.45\">Rasio t/n³ naik dari 43–45 ns ke 66 ns: efek <i>cache</i> pada tabel besar.</p>\n</div>\n</div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7585\">Python murni, rata-rata 5 ulangan, seed 42 · 09</p>", "notes": "Eksperimen pertama mengukur waktu DP untuk n dari 50 sampai 800. Pada skala log-log, kemiringannya 3,127, dekat dengan teori 3. Sedikit lebih dari 3 karena pada n besar tabel tidak muat di cache CPU. Ukuran 10 pangkat 6 seperti di panduan tidak realistis untuk algoritma kubik.", "title": "Pengukuran mengikuti kurva n³"}, {"id": "eksp2", "style": "background:#FBFBF8;color:#3E4A5C;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:32px", "html": "<h2 style=\"font-size:64px;font-weight:600;line-height:1.15;color:#14213D\">Brute force melonjak sekitar 3 kali per matriks</h2>\n<div style=\"display:flex;gap:56px;align-items:center\">\n<img src=\"assets/img/gambar2.png\" alt=\"Grafik waktu DP dan brute force untuk n 2 sampai 15 pada skala log; brute force naik eksponensial sampai 2.032 ms mengikuti kurva c·3ⁿ⁻¹, DP tetap di bawah 1 ms mengikuti kurva c·n³\" style=\"width:920px;height:648px;object-fit:contain\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:32px\">\n<div style=\"display:flex;flex-direction:column;gap:4px\">\n<p style=\"font-size:24px;color:#6B7585;letter-spacing:1px\">PADA n = 15</p>\n<p style=\"font-size:120px;font-weight:700;line-height:1;color:#C4610E\">9.194×</p>\n<p style=\"font-size:28px\">lebih lambat dari DP</p>\n</div>\n<p style=\"font-size:28px;line-height:1.45\">2.032 ms lawan 0,22 ms. Hasil biaya selalu sama.</p>\n<p style=\"font-size:28px;line-height:1.45\">Rasio antarlangkah ≈ 3,17, sesuai analisis R(n) = 3ⁿ⁻¹.</p>\n</div>\n</div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7585\">Rata-rata ± simpangan baku dari 5 ulangan · garis putus-putus = kurva teoretis · 10</p>", "notes": "Eksperimen kedua membandingkan dengan brute force. Untuk n kecil brute force sedikit lebih cepat karena DP membuat tabel dulu. Pada n = 4 keduanya setara, mulai n = 5 DP selalu menang, dan pada n = 15 brute force sekitar 9.200 kali lebih lambat. Titik-titiknya berimpit dengan kurva teoretis c·3^(n−1) dan c·n³. Rasio antarlangkah mendekati 3, sesuai turunan R(n) = 3^(n−1).", "title": "Brute force melonjak sekitar 3 kali per matriks"}, {"id": "studikasus", "style": "background:#FBFBF8;color:#3E4A5C;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:28px", "html": "<h2 style=\"font-size:64px;font-weight:600;line-height:1.15;color:#14213D\">Studi kasus: urutan terburuk 15 sampai 94 kali lebih lambat</h2>\n<img src=\"assets/img/gambar3.png\" alt=\"Dua grafik batang: jumlah perkalian skalar dan waktu median NumPy untuk urutan kiri-ke-kanan, kanan-ke-kiri, optimal, dan NumPy multi_dot pada tiga skenario\" style=\"width:1344px;height:480px;object-fit:contain\">\n<div style=\"display:flex;gap:40px\">\n<p style=\"flex:1;font-size:28px;line-height:1.4\"><b style=\"color:#14213D\">MLP 784–512–256–128–10:</b> urutan alami kanan-ke-kiri 42× perkalian, ±22× waktu</p>\n<p style=\"flex:1;font-size:28px;line-height:1.4\"><b style=\"color:#14213D\">Jacobian × vektor:</b> 1.000× perkalian, 94× waktu</p>\n<p style=\"flex:1;font-size:28px;line-height:1.4\"><b style=\"color:#14213D\">Rantai heterogen:</b> optimal 15× lebih cepat dari urutan naif terburuk</p>\n</div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7585\">NumPy, 3 pemanasan + 20 ulangan, median · 11</p>", "notes": "Studi kasus memakai perkalian matriks sungguhan dengan NumPy. Tiga skenario: jaringan saraf MLP, rantai Jacobian kali vektor seperti pada automatic differentiation, dan rantai heterogen. Pengurungan optimal dari DP selalu tercepat, dan urutan terburuk 15 sampai 94 kali lebih lambat. Pada MLP, pengukuran baris Optimal sempat terganggu, tetapi pengurungan yang sama terukur 1,40 ms sebagai kiri-ke-kanan. Semua urutan menghasilkan matriks yang sama.", "title": "Studi kasus: urutan terburuk 15 sampai 94 kali lebih lambat"}, {"id": "pembahasan", "style": "background:#F5F6F2;color:#3E4A5C;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px", "html": "<h2 style=\"font-size:64px;font-weight:600;line-height:1.15;color:#14213D\">Pembahasan</h2>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:40px\">\n<div style=\"display:flex;flex-direction:column;gap:12px;background:#FBFBF8;padding:40px;border:1px solid #D8DCD6;border-radius:16px\">\n<h3 style=\"font-size:36px;font-weight:600;color:#14213D\">Hemat waktu &lt; hemat perkalian</h3>\n<p style=\"font-size:28px;line-height:1.45\">Jacobian: perkalian 1.000× lebih sedikit, waktu hanya 94×. BLAS jauh lebih efisien pada matriks besar daripada matriks-vektor, sejalan dengan Barthels dkk. [5].</p>\n</div>\n<div style=\"display:flex;flex-direction:column;gap:12px;background:#FBFBF8;padding:40px;border:1px solid #D8DCD6;border-radius:16px\">\n<h3 style=\"font-size:36px;font-weight:600;color:#14213D\">Urutan intuitif belum tentu benar</h3>\n<p style=\"font-size:28px;line-height:1.45\">Pada MLP, menerapkan layer satu per satu butuh 42× perkalian. Pada Jacobian justru sebaliknya.</p>\n</div>\n<div style=\"display:flex;flex-direction:column;gap:12px;background:#FBFBF8;padding:40px;border:1px solid #D8DCD6;border-radius:16px\">\n<h3 style=\"font-size:36px;font-weight:600;color:#14213D\">Sama dengan pustaka</h3>\n<p style=\"font-size:28px;line-height:1.45\">numpy.linalg.multi_dot memilih pengurungan yang identik dengan DP di ketiga skenario.</p>\n</div>\n<div style=\"display:flex;flex-direction:column;gap:12px;background:#FBFBF8;padding:40px;border:1px solid #D8DCD6;border-radius:16px\">\n<h3 style=\"font-size:36px;font-weight:600;color:#14213D\">Biaya DP sangat kecil</h3>\n<p style=\"font-size:28px;line-height:1.45\">Puluhan mikrodetik untuk 5–8 matriks, jauh di bawah waktu perkaliannya.</p>\n</div>\n</div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7585\">12</p>", "notes": "Empat poin pembahasan. Pertama, penghematan waktu nyata lebih kecil dari penghematan jumlah perkalian karena efisiensi BLAS bergantung pada bentuk matriks. Kedua, urutan yang terasa alami belum tentu optimal. Ketiga, hasil DP saya identik dengan multi_dot di NumPy. Keempat, menghitung urutan optimal hampir selalu sepadan.", "title": "Pembahasan"}, {"id": "demo", "style": "background:#E9EDF2;color:#3E4A5C;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:row;gap:64px;align-items:center", "html": "<div style=\"flex:1;display:flex;flex-direction:column;gap:32px\">\n<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:26px;color:#1F5FBF;letter-spacing:2px\">DEMO</p>\n<h2 style=\"font-size:64px;font-weight:600;line-height:1.15;color:#14213D\">Visualisasi interaktif</h2>\n<p style=\"font-size:30px;line-height:1.45\">Tabel m dan s terisi langkah demi langkah, beserta perhitungan q untuk setiap titik belah dan perbandingan studi kasus.</p>\n<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:26px;color:#14213D\">sandimukti.github.io/matrix-chain-multiplication</p>\n<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:26px;color:#6B7585\">github.com/SandiMukti/matrix-chain-multiplication</p>\n</div>\n<img src=\"assets/img/vis1.png\" alt=\"Tangkapan layar visualisasi web: tabel m dan s untuk contoh CLRS dengan hasil pengurungan optimal 15.125\" style=\"width:780px;height:824px;object-fit:contain;border-radius:12px\">\n<p style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7585\">13</p>", "notes": "Buka situs visualisasi, tekan Putar untuk menunjukkan tabel terisi. Lalu pilih tab studi kasus Jacobian. Kalau internet bermasalah, jalankan lokal dengan python -m http.server.", "title": "Visualisasi interaktif"}, {"id": "kesimpulan", "style": "background:#F5F6F2;color:#3E4A5C;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:44px", "html": "<h2 style=\"font-size:64px;font-weight:600;line-height:1.15;color:#14213D\">Kesimpulan</h2>\n<div style=\"display:flex;gap:56px\">\n<div style=\"flex:3;display:flex;flex-direction:column;gap:20px\">\n<ol style=\"font-size:30px;line-height:1.45;color:#3E4A5C\">\n<li>DP bottom-up selalu optimal: dibuktikan dengan lemma dan induksi, dikonfirmasi brute force dan multi_dot.</li>\n<li>Waktu tepat (n³ − n)/6 = Θ(n³) di semua kasus; ruang Θ(n²).</li>\n<li>Pengukuran sejalan: kemiringan 3,127 dan brute force naik ≈ 3× per matriks.</li>\n<li>Urutan optimal menghemat 15–94× waktu perkalian nyata.</li>\n</ol>\n</div>\n<div style=\"flex:2;display:flex;flex-direction:column;gap:16px;background:#FBFBF8;padding:40px;border:1px solid #D8DCD6;border-radius:16px\">\n<h3 style=\"font-size:32px;font-weight:600;color:#14213D\">Keterbatasan dan pengembangan</h3>\n<p style=\"font-size:26px;line-height:1.45\">Kubik: n = 800 sudah 34 detik di Python.</p>\n<p style=\"font-size:26px;line-height:1.45\">Model biaya mengabaikan BLAS dan memori.</p>\n<p style=\"font-size:26px;line-height:1.45\">Lanjutan: Hu–Shing O(n log n), model biaya berbasis waktu, Strassen.</p>\n</div>\n</div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7585\">14</p>", "notes": "Empat kesimpulan utama, lalu keterbatasan. Untuk rantai sangat panjang, kubik menjadi lambat, dan model biaya jumlah perkalian tidak sepenuhnya mencerminkan waktu nyata. Pengembangan berikutnya: Hu–Shing, model biaya berbasis waktu, atau gabungan dengan Strassen.", "title": "Kesimpulan"}, {"id": "penutup", "style": "background:#14213D;color:#BFCBDD;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:space-between", "html": "<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;color:#8FB3E8;letter-spacing:2px\">TERIMA KASIH</p>\n<div style=\"display:flex;flex-direction:column;gap:32px\">\n<h1 style=\"font-size:104px;font-weight:700;line-height:1.05;color:#F5F6F2\">Pertanyaan?</h1>\n<p style=\"font-size:36px;line-height:1.4;width:1400px\">Urutan perkalian tidak mengubah hasil, tetapi bisa mengubah biayanya ribuan kali.</p>\n</div>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<p style=\"font-size:26px;color:#BFCBDD\">Referensi utama: [1] Cormen dkk., Introduction to Algorithms · [2] Godbole 1973 · [5] Barthels dkk. 2018 · [6] Linnea, ACM TOMS 2021</p>\n<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:26px;color:#F5F6F2\">github.com/SandiMukti/matrix-chain-multiplication</p>\n</div>", "notes": "Tutup dengan satu kalimat inti, lalu buka sesi tanya jawab. Siapkan jawaban untuk: kenapa loop berdasarkan panjang l, dari mana suku p[i-1]·p[k]·p[j], penurunan (n³ − n)/6, dan kenapa penghematan waktu lebih kecil dari penghematan perkalian.", "title": "Pertanyaan?"}];
  let cur = 0;
  const mk = s => `<div class="slide" style="${s.style}">${s.html}</div>`;
  $("#stage").innerHTML = SLIDES.map(mk).join("");
  $("#jump").innerHTML = SLIDES.map((s, i) => `<option value="${i}">${i + 1}. ${s.title}</option>`).join("");
  $("#thumbs").innerHTML = SLIDES.map((s, i) => `<button data-i="${i}"><span class="t"><span class="stage">${mk(s).replace('class="slide"', 'class="slide on"')}</span></span><span>${i + 1}. ${s.title}</span></button>`).join("");
  const slides = [...$("#stage").children];
  function fit() {
    const box = $("#box"), w = box.clientWidth, h = box.clientHeight, sc = Math.min(w / 1920, h / 1080);
    const st = $("#stage"); st.style.transform = `translate(${(w - 1920 * sc) / 2}px, ${(h - 1080 * sc) / 2}px) scale(${sc})`;
    document.querySelectorAll(".thumbs .t").forEach(t => { t.firstElementChild.style.transform = `scale(${t.clientWidth / 1920})`; });
  }
  function go(i) {
    cur = Math.max(0, Math.min(SLIDES.length - 1, i));
    slides.forEach((s, k) => s.classList.toggle("on", k === cur));
    $("#count").textContent = `${cur + 1} / ${SLIDES.length}`;
    $("#prog").style.width = `${(cur + 1) / SLIDES.length * 100}%`;
    $("#jump").value = cur;
    $("#noteText").textContent = SLIDES[cur].notes || "Tidak ada catatan.";
    document.querySelectorAll(".thumbs button").forEach((b, k) => b.setAttribute("aria-current", k === cur ? "true" : "false"));
    $("#prev").disabled = cur === 0; $("#next").disabled = cur === SLIDES.length - 1;
    try { history.replaceState(null, "", "#s" + (cur + 1)); } catch (e) {}
  }
  $("#prev").onclick = () => go(cur - 1);
  $("#next").onclick = () => go(cur + 1);
  $("#jump").onchange = e => go(+e.target.value);
  $("#thumbs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { go(+b.dataset.i); $("#box").scrollIntoView({ block: "center" }); } });
  $("#box").addEventListener("click", e => { const r = e.currentTarget.getBoundingClientRect(); go(cur + (e.clientX - r.left < r.width * 0.3 ? -1 : 1)); });
  $("#notesBtn").onclick = e => { const on = e.currentTarget.getAttribute("aria-pressed") !== "true"; e.currentTarget.setAttribute("aria-pressed", on); $("#notes").hidden = !on; };
  async function fullscreen() {
    try { if (document.fullscreenElement) await document.exitFullscreen(); else await $("#box").requestFullscreen(); }
    catch (err) { $("#fs").textContent = "Layar penuh tidak tersedia"; $("#fs").disabled = true; }
  }
  $("#fs").onclick = fullscreen;
  document.addEventListener("fullscreenchange", () => setTimeout(fit, 50));
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(cur + 1); }
    if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
    if (e.key === "Home") go(0); if (e.key === "End") go(SLIDES.length - 1);
    if (e.key === "f" || e.key === "F") fullscreen();
  });
  addEventListener("resize", fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  const m = location.hash.match(/^#s(\d+)$/);
  go(m ? +m[1] - 1 : 0); fit();
})();
</script>
</body>
</html>
